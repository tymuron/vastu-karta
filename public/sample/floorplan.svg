<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <rect width="1000" height="800" fill="#ffffff"/>
  <!-- floor fill -->
  <path d="M120,140 L680,140 L680,320 L880,320 L880,660 L120,660 Z" fill="#f7f5f1"/>

  <!-- interior partitions (drawn under exterior so joints look clean) -->
  <g stroke="#2b2b2b" stroke-width="6" stroke-linecap="square">
    <line x1="440" y1="140" x2="440" y2="660"/>
    <line x1="120" y1="410" x2="440" y2="410"/>
    <line x1="680" y1="470" x2="880" y2="470"/>
    <line x1="440" y1="470" x2="680" y2="470"/>
    <!-- bathroom box -->
    <line x1="560" y1="320" x2="560" y2="470"/>
    <line x1="560" y1="320" x2="680" y2="320"/>
  </g>

  <!-- exterior walls -->
  <path d="M120,140 L680,140 L680,320 L880,320 L880,660 L120,660 Z"
        fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linejoin="miter"/>

  <!-- windows: white gaps with double blue lines on exterior walls -->
  <g>
    <!-- bottom wall (the street-facing wall with windows) -->
    <rect x="200" y="654" width="150" height="13" fill="#ffffff"/>
    <line x1="200" y1="657.5" x2="350" y2="657.5" stroke="#4a76a8" stroke-width="2"/>
    <line x1="200" y1="662.5" x2="350" y2="662.5" stroke="#4a76a8" stroke-width="2"/>
    <rect x="520" y="654" width="150" height="13" fill="#ffffff"/>
    <line x1="520" y1="657.5" x2="670" y2="657.5" stroke="#4a76a8" stroke-width="2"/>
    <line x1="520" y1="662.5" x2="670" y2="662.5" stroke="#4a76a8" stroke-width="2"/>
    <!-- right wall window -->
    <rect x="874" y="420" width="13" height="140" fill="#ffffff"/>
    <line x1="877.5" y1="420" x2="877.5" y2="560" stroke="#4a76a8" stroke-width="2"/>
    <line x1="882.5" y1="420" x2="882.5" y2="560" stroke="#4a76a8" stroke-width="2"/>
    <!-- top wall window -->
    <rect x="240" y="134" width="130" height="13" fill="#ffffff"/>
    <line x1="240" y1="137.5" x2="370" y2="137.5" stroke="#4a76a8" stroke-width="2"/>
    <line x1="240" y1="142.5" x2="370" y2="142.5" stroke="#4a76a8" stroke-width="2"/>
  </g>

  <!-- front door on the left wall with swing arc -->
  <g>
    <rect x="114" y="500" width="13" height="80" fill="#ffffff"/>
    <path d="M120,580 A80,80 0 0,0 200,500" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
    <line x1="120" y1="580" x2="200" y2="580" stroke="#1a1a1a" stroke-width="3"/>
  </g>

  <!-- room labels -->
  <g fill="#6b6b6b" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="280" y="280">Спальня</text>
    <text x="280" y="545">Кухня</text>
    <text x="500" y="245">С/у</text>
    <text x="620" y="245">Ванная</text>
    <text x="690" y="420">Гостиная</text>
    <text x="690" y="570">Прихожая</text>
  </g>

  <!-- a small north hint the user can ignore (plans rarely have one) -->
  <g transform="translate(930,90)" fill="#bbbbbb">
    <circle r="22" fill="none" stroke="#cccccc" stroke-width="1"/>
    <path d="M0,-16 L6,6 L0,1 L-6,6 Z" fill="#cfcfcf"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Arial" font-size="13" fill="#bbbbbb">С</text>
  </g>
</svg>
