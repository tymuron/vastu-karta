# Render static site — live at https://annaromeo-vastu-karta.onrender.com
#
# Source of truth: scratch/vastu-map-builder in the (private) antigravity-workspace repo.
# Only this folder is published, to the public repo github.com/tymuron/vastu-karta, which
# Render auto-deploys from (main). To ship a change, commit in the workspace, then:
#
#   git subtree push --prefix=scratch/vastu-map-builder vastu-karta main
#
# Maps: Yandex for Russia, Google abroad; their browser keys are in src/config.ts (MAP_KEYS),
# locked to this site in the providers' consoles. No environment variables are needed.
# No SPA rewrite on purpose: the page has no client-side routes, and a catch-all would
# answer missing assets with index.html (200) and hide broken deploys.
services:
  - type: web
    name: annaromeo-vastu-karta
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
